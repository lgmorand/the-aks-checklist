name: Validation Build
on:
  pull_request:
    branches: [staging, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-checklist
      - uses: actions/upload-artifact@v7
        with:
          name: CheckList
          path: |
            src/web
            output
          retention-days: 7
