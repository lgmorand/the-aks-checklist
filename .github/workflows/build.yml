name: Validation Build 

on:
  pull_request:
    branches:
      - staging
      - master
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Check that data is OK
      run: |
        python3 data/scripts/checklist.py
        python3 -m unittest discover -s data/scripts -p "test_*.py"
        node data/scripts/test_link_tracking.js
        node data/scripts/test_checklist_state.js
        node data/scripts/test_theme.js

    - name: Run the Transformer
      run: |
        python3 data/scripts/transform_to_ft.py
        python3 data/scripts/generate_offline.py --pdf src/web/docs/AKS-Checklist.pdf

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: | 
          10.0.x
    
    - name: Build the generator
      run: |
        dotnet publish -c Release -r linux-x64 --self-contained true
      working-directory: ./src/generator

    - name: Move the generator
      run: |
        mkdir -p ./data/tooling/html-generator
        cp ./src/generator/bin/Release/net10.0/linux-x64/publish/* ./data/tooling/html-generator/

    - name: Generate the checklist
      run: |
        chmod +x aks-generator
        ./aks-generator -f template.html -p "../../en/items" -o "../../../src/web/index.html"
      working-directory: ./data/tooling/html-generator

    - name: Validate generated checklist markup
      run: node data/scripts/test_checklist_state.js src/web/index.html

    - uses: actions/upload-artifact@v7
      with:
        name: CheckList
        path: src/web
        retention-days: 3
       
