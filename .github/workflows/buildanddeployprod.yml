name: Build and deploy on prod
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-checklist
      - uses: actions/upload-artifact@v7
        with:
          name: CheckList
          path: src/web
          retention-days: 7
      - name: Azure login
        env:
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SECRET_ID }}
          TENANT_ID: ${{ vars.TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID }}
        run: |
          az login --service-principal --username "$CLIENT_ID" --password "$CLIENT_SECRET" --tenant "$TENANT_ID" --output none
          az account set --subscription "$SUBSCRIPTION_ID"
      - name: Publish site and offline guides
        run: az storage blob upload-batch --source src/web --destination '$web' --account-name stostatheakschecklist --overwrite
      - name: Azure logout
        if: always()
        run: az logout
