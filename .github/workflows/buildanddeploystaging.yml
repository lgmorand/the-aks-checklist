name: Build and deploy on staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
 
    - name: Run the Transformer
      run: |
        python3 data/scripts/transform_to_ft.py
        python3 data/scripts/generate_offline.py --pdf src/web/docs/AKS-Checklist.pdf

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: | 
          10.0.x
    
    - name: Build the generator
      run: |
        dotnet publish -c Release -r linux-x64 --self-contained true
      working-directory: ./src/generator

    - name: Move the generator
      run: |
        mkdir -p ./data/tooling/html-generator
        cp ./src/generator/bin/Release/net10.0/linux-x64/publish/* ./data/tooling/html-generator/

    - name: Generate the checklist
      run: |
        chmod +x aks-generator
        ./aks-generator -f template.html -p "../../en/items" -o "../../../src/web/index.html"
      working-directory: ./data/tooling/html-generator

    - uses: actions/upload-artifact@v7
      with:
        name: CheckList
        path: src/web
        retention-days: 3
 
    - name: AZ Login
      run: | 
        az login --service-principal -u ${{ vars.CLIENT_ID }} -p ${{ secrets.SECRET_ID }} -t ${{ vars.TENANT_ID }}
        az account set --subscription ${{ vars.SUBSCRIPTION_ID }}
         
    - name: upload to Azure Blob Storage
      run: az storage blob upload-batch -s "./src/web" -d \$web --account-name "stostatheakscheckliststg"  --overwrite
    
