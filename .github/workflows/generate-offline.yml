name: Generate offline version

on:
  push:
    paths:
      - 'data/en/**'
      - 'data/scripts/**'
      - '.github/workflows/generate-offline.yml'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generateFile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pandoc for Word export
        run: sudo apt-get update && sudo apt-get install --assume-yes pandoc

      - name: Build styled offline Markdown, HTML, PDF and Word
        run: python3 data/scripts/generate_offline.py --pdf output/AKS-Checklist.pdf --docx output/AKS-Checklist.docx

      - name: Azure Blob Storage Upload
        uses: bacongobbler/azure-blob-storage-upload@v3.0.0
        with:
          connection_string: ${{ secrets.BLOB_CONNECTION_STRING }}
          container_name: $web
          source_dir: './output'
          extra_args: "--destination-path docs"
          overwrite: 'true'

      - name: Upload a Build Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Offline resources
          path: ./output/AKS-Checklist.*
